# Instagram @fmtpa: posts one rendered reel, or reads the numbers of every post.
# Started by hand or by the promotion runs (workflow_dispatch only). The reel files (reels/<slug>/reel.mp4 + reel.json)
# live on the branch claude/reels-media, NOT the default branch, so reels and their records never redeploy the game.
# action "dry-run" checks the token and the account and posts nothing; "post" posts (public!); "stats" saves
# reels/stats.json on the media branch. The first 3 reels are only posted after Murat said yes to each one.
# Needs the repo secret INSTAGRAM_TOKEN (long-lived token, ~60 days: renew it before it runs out).
name: Instagram reel

on:
  workflow_dispatch:
    inputs:
      action:
        description: "dry-run, post or stats"
        type: choice
        options: [dry-run, post, stats]
        default: dry-run
      reel:
        description: "Reel folder, e.g. reels/2026-11-21-first-look (not needed for stats)"
        type: string
        default: ""
      caption:
        description: "Caption (empty = the one in reel.json)"
        type: string
        default: ""
      force:
        description: "Post again even if this reel was already posted"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-reel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/relaxed-wozniak-cjs85z
      - uses: actions/checkout@v4
        with:
          ref: claude/reels-media
          path: media
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          ACTION: ${{ inputs.action }}
          REEL: ${{ inputs.reel }}
          CAPTION: ${{ inputs.caption }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$ACTION" = "stats" ]; then node tools/reels/publish.mjs --stats media/reels/stats.json; exit; fi
          case "$REEL" in reels/*) ;; *) echo "::error::reel must be a folder under reels/"; exit 1;; esac
          case "$REEL" in *..*) echo "::error::bad reel path"; exit 1;; esac
          if [ "$ACTION" = "post" ]; then node tools/reels/publish.mjs "media/$REEL" --publish; else node tools/reels/publish.mjs "media/$REEL"; fi
      - name: Save the record on the media branch
        if: inputs.action != 'dry-run'
        working-directory: media
        env:
          MSG: "Instagram ${{ inputs.action }} ${{ inputs.reel }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A reels
          git diff --cached --quiet && exit 0
          git commit -qm "$MSG"
          for i in 1 2 3; do git pull --rebase -q origin claude/reels-media && git push -q origin HEAD:claude/reels-media && break; sleep 5; done
