# Every PR into the default branch must typecheck, pass the tests, build, and boot.
# auto-merge.yml starts when this check finishes: a PR that fails it is never merged (nothing reaches the live game).
# Draft PRs are skipped (saves paid minutes on work in progress); marking the PR ready runs the full check.
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [claude/relaxed-wozniak-cjs85z]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the suite takes 12-14 min on the runner since the moors and badlands; 15 cut it off mid-build
    # A throwaway Postgres for the account-store tests and the smoke test on Postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests, 2 files at a time (the runner has 2 cores)
        run: npm run test:ci
      - name: Typecheck and build (same as the Dockerfile)
        run: npm run build
      - name: Smoke test (the built server boots and a hero can log in)
        run: node tools/smoke.mjs
      - name: Smoke test on Postgres (DATABASE_URL)
        run: DATABASE_URL="$TEST_DATABASE_URL" node tools/smoke.mjs
